<style>
/* un seul thème (sombre), quel que soit le réglage clair/sombre de l'appareil */
:root{
  color-scheme:dark;
  --bg:#0c121c;--bg2:#121a27;--card:#161f2d;--ink:#ffffff;--mute:#dbe2ec;--line:#263247;
  --brand:#a9c3ff;--brand2:#5d8ef0;--accent:#f0b75a;--sky1:#0a1630;--sky2:#1b3c78;
  --ok:#4cc38a;--okbg:#12301f;--ko:#ff7d70;--kobg:#3a1a18;--warn:#f0b75a;--warnbg:#36280f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --radius:16px;
}
/* ----- image de fond (paysage = PC, portrait = téléphone) ----- */
:root{--bg-blur:2px;--veil:rgba(8,13,22,.26);--glass:rgba(22,31,45,.42);--glass2:rgba(255,255,255,.07)}
.hero .stat{background:rgba(10,18,32,.3)!important}
#bgimg{position:fixed;inset:0;z-index:-2;background:#0c121c url("media/bg-avion.png") center/cover no-repeat;filter:blur(var(--bg-blur));transform:scale(1.06)}
@media (orientation:portrait){#bgimg{background-image:url("media/bg-mobile.png");background-position:center 40%}}
#veil{position:fixed;inset:0;z-index:-1;background:var(--veil)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html{background:var(--bg)}
/* ----- « Liquid Glass » façon Apple -----
   1) verre clair : peu de flou, saturation forte (le flou seul « salit » les couleurs), teinte très légère
   2) liseré spéculaire : bord lumineux en haut à gauche, reflet plus faible en bas à droite (::after masqué en anneau)
   3) relief : ombre interne claire sur le bord haut, sombre sur le bord bas, ombre portée douce
   4) réfraction des bords (Chrome/Edge seulement) : filtre SVG de déplacement généré par taille de boîte (script lgInit) */
:root{--lg-tint:rgba(14,20,32,.22);--lg-blur:7px;--lg-rim:rgba(255,255,255,.62);--lg-rim2:rgba(255,255,255,.26)}
.mbox,.action,.mod,.qcard,.cchap,.hero .stat,body.session #side{
  --lg-bf:blur(var(--lg-blur)) saturate(190%) brightness(1.08);
  background:radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.10),rgba(255,255,255,0) 55%),var(--lg-tint)!important;
  backdrop-filter:var(--lg-bf)!important;-webkit-backdrop-filter:var(--lg-bf)!important;
  border-color:transparent!important;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.28),inset 0 -1px 1px rgba(0,0,0,.18),inset 0 0 22px rgba(255,255,255,.05),0 12px 32px rgba(0,0,0,.28),0 1px 3px rgba(0,0,0,.2)!important}
.mbox,.action,.mod,.qcard,.cchap,.hero .stat{position:relative}
.mbox::after,.action::after,.mod::after,.qcard::after,.cchap::after,.hero .stat::after,body.session #side::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.3px;pointer-events:none;z-index:3;
  background:linear-gradient(135deg,var(--lg-rim) 0%,rgba(255,255,255,.12) 22%,rgba(255,255,255,0) 45%,rgba(255,255,255,0) 58%,rgba(255,255,255,.1) 78%,var(--lg-rim2) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
body.session #side::after{position:fixed;inset:auto;display:none}
.action:hover:not(:disabled),.mod:hover,.cchap:hover{background:radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.18),rgba(255,255,255,0) 60%),var(--lg-tint)!important}
.action.train{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 1px rgba(255,255,255,.28),0 12px 32px rgba(0,0,0,.28)!important}
.topbar{background:linear-gradient(135deg,rgba(15,35,71,.72),rgba(36,83,158,.55))!important;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero{background:transparent!important;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.hero::after{display:none}
.hero .stat{background:rgba(10,18,32,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.section-title h3{text-shadow:0 1px 8px var(--veil)}
body{margin:0;background:transparent;color:var(--ink);font:16px/1.55 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh}
a{color:var(--brand2)}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ----- bandeau ----- */
.hero{background:linear-gradient(135deg,var(--sky1),var(--sky2));color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%);pointer-events:none}
.hero-in{max-width:960px;margin:0 auto;padding:22px 16px 26px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px;opacity:.95}
.brand .logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.hero h1{font-size:clamp(22px,4vw,30px);margin:14px 0 4px;line-height:1.2}
.hero p{margin:0;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:12.5px}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}

/* barre de session */
.topbar{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--sky1),var(--sky2));color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.topbar-in{margin:0;padding:10px 16px;display:flex;align-items:center;gap:12px}
.topbar h2{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:0;color:#fff;padding:7px 12px;border-radius:10px;cursor:pointer}
.back:hover{background:rgba(255,255,255,.22)}
.live{font-size:14px;opacity:.9;white-space:nowrap}
.progress{height:4px;background:rgba(255,255,255,.18)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .35s ease}

main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
main.narrow{max-width:820px}

/* ----- actions ----- */
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:-34px;position:relative;z-index:2}
@media (max-width:700px){.actions{grid-template-columns:1fr}}
.actions.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:700px){.actions.three{grid-template-columns:1fr}}
.action.train{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.actions.pick{grid-template-columns:repeat(2,1fr)}
/* ----- paramétrage de l'entraînement ----- */
.setup h3{font-size:15px;margin:18px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;background:var(--card);font-weight:600;font-size:14.5px}
.seg label small{font-weight:500;color:var(--mute)}
.seg input{accent-color:var(--brand2)}
.seg label:has(input:checked){border-color:var(--brand2);background:color-mix(in srgb,var(--brand2) 9%,var(--card))}
.seg label:has(input:disabled){opacity:.45;cursor:default}
.modebox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modebox label{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:var(--card)}
.modebox label:has(input:checked){border-color:var(--brand2);background:color-mix(in srgb,var(--brand2) 9%,var(--card))}
.modebox b{display:block;font-size:15.5px}.modebox span{font-size:13.5px;color:var(--mute)}
.modebox input{margin-top:3px;accent-color:var(--brand2)}
@media (max-width:600px){.modebox{grid-template-columns:1fr}}
.setup .total{margin-top:16px;font-size:14px;color:var(--mute);text-align:center}
.quote{margin:8px 0 0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--bg2);border-radius:10px;font-size:14.5px}
.quote .src{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--warn);margin-bottom:3px}
.quote .src svg.i{width:14px;height:14px}
.quote q{font-style:italic}
.quote .btn{margin-top:8px;font-size:13px;padding:6px 11px}
.chip.cours{background:var(--warnbg);color:var(--warn)}
.quit-ov{position:fixed;inset:0;z-index:60;background:rgba(5,10,20,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;animation:in .15s ease}
.quit-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.quit-card .ic{width:46px;height:46px;border-radius:14px;display:inline-grid;place-items:center}
.quit-card h3{margin:12px 0 6px;font-size:19px}
.quit-card p{margin:0 0 18px;color:var(--mute);font-size:14.5px}
.quit-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.report{text-align:left;margin-top:18px}
.report details{border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--card);overflow:hidden}
.report summary{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-weight:600;list-style:none}
.report summary::-webkit-details-marker{display:none}
.report summary .rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.report summary .rk.ok{background:var(--ok)}.report summary .rk.ko{background:var(--ko)}
.report summary .rk svg.i{width:15px;height:15px;stroke-width:3}
.report summary .rt{flex:1;min-width:0}
.report .rbody{padding:4px 16px 14px;border-top:1px solid var(--line)}
.report .rbody .q-title{display:none}
.report .rbody .kicker{justify-content:flex-start}
.report-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.actions.pick .action{padding:22px 20px}
.actions.pick .action .ic{width:54px;height:54px}
.actions.pick .action b{font-size:18px}
.pick-col{display:flex;flex-direction:column;gap:10px}
/* menu principal : 3 encadrés */
.menu{display:flex;flex-direction:column;gap:16px;margin-top:-34px;position:relative;z-index:2}
.mbox{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:14px 16px 16px;box-shadow:var(--shadow)}
.mbox h3{display:flex;align-items:center;gap:8px;margin:0 2px 12px;font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.mbox h3 svg.i{width:18px;height:18px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid .action{padding:14px 18px;box-shadow:none}
.mgrid .action .ic{width:44px;height:44px}
.mgrid .action b{font-size:16px}
.mgrid .action.wide{grid-column:1/-1;justify-self:center;width:min(480px,100%)}
@media (max-width:700px){.mgrid{grid-template-columns:1fr}}
.actions.pick .pick-mid{grid-column:1/-1;justify-self:center;width:min(480px,100%)}
.actions.pick .action.cours-pick{padding:14px 20px}
.actions.pick .action.cours-pick .ic{width:44px;height:44px}
.actions.pick .action.cours-pick b{font-size:16px}
@media (max-width:700px){.actions.pick{grid-template-columns:1fr}}
.action{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .15s}
.action:hover:not(:disabled){transform:translateY(-2px);border-color:var(--brand2)}
.action:disabled{opacity:.55;cursor:default}
.action .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.action b{display:block;font-size:15px}
.action span{font-size:13px;color:var(--mute)}
.ic.blue{background:rgba(36,87,184,.12);color:var(--brand2)}
.ic.red{background:var(--kobg);color:var(--ko)}
.ic.amber{background:var(--warnbg);color:var(--warn)}

.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.section-title h3{margin:0;font-size:18px}
.section-title a{font-size:13px;color:var(--mute)}

/* ----- modules ----- */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.mod{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;transition:transform .15s,border-color .15s}
.mod:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--brand2) 45%,var(--line))}
.mod.prio{border-top:3px solid var(--accent)}
.mod-head{display:flex;gap:12px;align-items:flex-start}
.mod-ic{width:44px;height:44px;border-radius:12px;background:rgba(36,87,184,.1);color:var(--brand2);display:grid;place-items:center;flex:none}
.mod-ic svg.i{width:22px;height:22px}
.mod-name{font-weight:650;font-size:16px;line-height:1.3}
.mod-meta{font-size:13px;color:var(--mute)}
.ring{margin-left:auto;flex:none;position:relative;width:52px;height:52px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bg2);color:var(--mute);font-weight:600}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.ko{background:var(--kobg);color:var(--ko)}
.mod-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.mod-btns .btn{padding:9px 10px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:11px;cursor:pointer;font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--brand2)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.primary{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--ko);border-color:color-mix(in srgb,var(--ko) 45%,var(--line))}
.btn.danger:hover:not(:disabled){background:var(--kobg);border-color:var(--ko)}
.set-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--card)}
@media (max-width:560px){.set-row{flex-wrap:wrap}.set-row .btn{width:100%}}
.section-title a{display:inline-flex;align-items:center;gap:5px}
.section-title a svg.i{width:15px;height:15px}
.yt-box{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;box-shadow:var(--shadow);margin-top:14px}
.yt-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pdf-box{border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#525659}
.pdf-box iframe{display:block;width:100%;height:75vh;border:0}
/* ----- cours (manuel + fiches) ----- */
.cours-ov{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;justify-content:center;padding:16px;animation:in .2s ease}
.cours-in{background:var(--card);border-radius:18px;width:min(1100px,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.cours-head{display:flex;align-items:center;gap:8px;padding:10px 10px 4px 18px;font-weight:700}
.cours-t{flex:1;min-width:0;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cours-tabs{display:flex;gap:8px;padding:6px 12px;overflow-x:auto;flex:none}
.ctab{display:flex;gap:9px;align-items:center;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:7px 13px;cursor:pointer;white-space:nowrap;text-align:left;flex:none}
.ctab:hover{border-color:color-mix(in srgb,var(--brand2) 60%,var(--line))}
.ctab b{display:block;font-size:14px}.ctab small{display:block;color:var(--mute);font-size:12px}
.ctab.on{border-color:var(--brand2);background:color-mix(in srgb,var(--brand2) 9%,var(--card));color:var(--brand2)}
.cours-pages{display:flex;gap:6px;padding:4px 12px 8px;overflow-x:auto;align-items:center;flex:none}
.cpg{min-width:36px;height:30px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer;font-weight:650;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:4px;flex:none;text-decoration:none}
.cpg:hover{border-color:var(--brand2);color:var(--ink)}
.cpg.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.cpg.ext{margin-left:auto;color:var(--brand2);padding:0 10px}
.cpg svg.i{width:15px;height:15px}
.cours-cur{padding:0 16px 8px;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.cours-pdf{flex:1;width:100%;min-height:0;border:0;background:#525659}
.cours-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cours-links:empty{display:none}
.mref{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:14px;
  background:color-mix(in srgb,var(--brand2) 16%,transparent);border:1px solid color-mix(in srgb,var(--brand2) 45%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.mref-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--brand2) 30%,transparent);color:#fff}
.mref-t{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.mref-t small{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--brand);font-weight:700}
.mref-t b{font-size:15.5px;color:var(--ink)}
.mref-t span{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.mref .btn{flex:none;padding:8px 12px;font-size:13.5px}
.cours-links .btn{font-size:13.5px;padding:7px 12px}
.cours-all{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:12px}
.cours-chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cchap{display:flex;gap:10px;align-items:center;text-align:left;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;color:var(--ink);transition:border-color .15s,transform .15s}
.cchap:hover{border-color:var(--brand2);transform:translateY(-1px)}
.cchap .mod-ic{width:34px;height:34px;border-radius:10px}
.cchap .mod-ic svg.i{width:18px;height:18px}
.cchap b{display:block;font-size:13.5px;line-height:1.25}
.cchap small{color:var(--mute);font-size:12px}
.section-title h3{display:inline-flex;align-items:center;gap:8px}

// titres propres : majuscules adoucies, titres tronqués ou trop vagues complétés
function vTitle(s, modId, dup) {
  let t = s.title.trim();
  if (t === t.toUpperCase()) t = t.charAt(0) + t.slice(1).toLowerCase();
  t = t.replace(/\b02\b/g, 'O2').replace(/\bo2\b/g, 'O2').replace(/\bbebe\b/gi, 'bébé').replace(/\bmateriels\b/gi, 'matériel').replace(/\bdsa\b/gi, 'DSA').replace(/\bbavu\b/gi, 'BAVU')
       .replace(/\brcp\b/gi, 'RCP').replace(/\bpls\b/gi, 'PLS').replace(/\bavox\b/gi, 'AVOX').replace(/sky blazer/gi, 'Sky Blazer').replace(/hafex/gi, 'Hafex').replace(/\bh2o\b/gi, 'H2O')
       .replace(/^Evacuations - terrestres$/i, 'Évacuations terrestres').replace(/^Evac/, 'Évac').replace(/^Le "feu-fumee"$/i, 'Le « feu-fumée »')
       .replace(/avant-$/, 'avant-bras').replace(/^Emballes /, 'Emballage ').replace(/^Administration /i, 'Administration O2 ').replace(/O2 O2/, 'O2')
       .replace(/^(Administration O2 bébé) O2$/, '$1').replace(/^Evolutions RCP Nourrisson$/, 'Évolutions RCP nourrisson').replace(/^Emballages de la tête$/, 'Emballage de la tête');
  if (modId === 5689) t = (t === 'Descriptions' ? 'Description' : t === 'Prévols' ? 'Prévol' : t) + ' · hache et pied de biche';
  if (dup) t += ` (partie ${dup})`;
  return t;
}
let VIDS = null;
function videoList() {
  if (VIDS) return VIDS;
  const seen = new Set(), out = [];
  for (const k of ['securite', 'secourisme']) {
    const f = FORMATIONS[k]; if (!f || !f.data) continue;
    for (const m of f.data.modules) {
      const vs = m.steps.filter(s => s.type === 'video');
      const same = t => vs.filter(x => x.title === t).length;
      vs.forEach(s => {
        if (seen.has(s.video)) return; // vidéo présente dans deux modules (bandages) : une seule fois
        seen.add(s.video);
        const dup = same(s.title) > 1 ? vs.filter(x => x.title === s.title).indexOf(s) + 1 : 0;
        const g = VGROUPS.find(g => g.f === k && (g.mods ? g.mods.includes(m.id) : g.re.test(s.title)));
        out.push({ ...s, mod:m.id, modName:m.name, f:k, g:g ? g.k : null, vt:vTitle(s, m.id, dup) });
      });
    }
  }
  return VIDS = out;
}

function idb(mode, fn) {

let VNEXT = null, UPT = null, UPDONE = false, VDUR = 0, VLAST = 0;
function watchEnd(ov) {
  UPDONE = false; VDUR = 0; VLAST = 0;
  const fr = ov.querySelector('#vyt');
  if (fr) fr.addEventListener('load', () => { // API YouTube par messages : on demande à être prévenu des changements d'état
    const w = fr.contentWindow;
    w.postMessage(JSON.stringify({ event:'listening', id:'vyt', channel:'widget' }), '*');
    w.postMessage(JSON.stringify({ event:'command', func:'addEventListener', args:['onStateChange'], id:'vyt', channel:'widget' }), '*');
  });

}
addEventListener('message', e => {
  if (!/^https:\/\/www\.youtube(-nocookie)?\.com$/.test(e.origin || '')) return;
  const fr = document.getElementById('vyt'); if (!fr || e.source !== fr.contentWindow) return; // messages d'un ancien lecteur : ignorés
  let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }
  if (!d || !document.getElementById('vplay')) return;
  if ((d.event === 'onStateChange' && d.info === 0) || (d.event === 'infoDelivery' && d.info && d.info.playerState === 0)) return upNextShow();
  // les Shorts tournent en boucle sans état « terminé » : fin = dernière seconde atteinte, ou retour au début après la fin
  if (d.event === 'infoDelivery' && d.info) {
    if (d.info.duration) VDUR = d.info.duration;
    const t = d.info.currentTime;
    if (typeof t === 'number' && VDUR > 3) {
      if (t >= VDUR - 0.8 || (VLAST > VDUR - 2.5 && t < 2)) upNextShow();
      VLAST = t;
    }
  }
});

// rubrique « Cours » de l'accueil : tout le cours (docs du test final) + un accès par chapitre
function coursSection() {
  const ms = DATA.modules.filter(m => hasCours(m.id));
  if (!ms.length) return '';
  const all = ms.find(m => m.assessment), chap = ms.filter(m => !m.assessment);
  const docs = all ? COURS.mods[all.id].map(k => COURS.docs[k]) : [];
  return `<div class="section-title"><h3>${ic('book')} Cours et fiches</h3></div>
    <div class="cours-home">
      ${all ? `<div class="cours-all">${COURS.mods[all.id].map(k => { const d = COURS.docs[k]; return `<button class="action" onclick="openCours(${all.id},'${k}',null,'Tout le cours ${F.label}')">
        <span class="ic ${d.kind === 'manuel' ? 'blue' : d.kind === 'recap' ? 'red' : 'amber'}">${ic(KIND_IC[d.kind])}</span>
        <span><b>${d.kind === 'manuel' ? `Manuel · partie ${F.label}` : d.kind === 'recap' ? 'Fiches récap secourisme' : 'Fiches de révision Enzo'}</b><span>${docRange(d)} · ${d.pages.length} pages</span></span></button>`; }).join('')}</div>` : ''}
      <div class="cours-chaps">${chap.map(m => `<button class="cchap" onclick="openCours(${m.id})"><span class="mod-ic">${ic(MOD_IC[m.id] || 'book')}</span><span><b>${esc(m.name)}</b><small>${docRange(COURS.docs[COURS.mods[m.id][0]])}</small></span></button>`).join('')}</div>
    </div>`;
}
function closeCours() { const ov = document.getElementById('cours'); if (ov) ov.remove(); CV = null; if (!document.getElementById('vplay')) document.body.classList.remove('cours-open'); }
// renvois d'une étape vers le cours : manuel en premier, puis fiche récap, puis ma fiche
function coursRefs(step, modId) {
  const refs = COURS && COURS.q[step.sid];
  if (!refs || !hasCours(modId)) return '';
  const order = { manuel:0, recap:1, fiche:2 };
  const mine = refs.filter(r => COURS.mods[modId].includes(r.doc)).sort((a, b) => order[COURS.docs[a.doc].kind] - order[COURS.docs[b.doc].kind]);
  // encadré « Dans ton manuel » : n° de page IMPRIMÉ dans le manuel papier (pas celui du PDF) + titre de la partie
  const man = mine.find(r => COURS.docs[r.doc].kind === 'manuel');
  const box = man ? manualBox(COURS.docs[man.doc], man.page, `openCours(${modId},'${man.doc}',${man.page})`) : '';
  return box + `<div class="cours-links">${mine.filter(r => r !== man).map((r, i) => {
    const d = COURS.docs[r.doc], p = pshort(pnum(d, r.page));
    // n° de ma fiche : dernière page « Fiche N » avant (ou sur) la page visée
    const fno = d.kind === 'fiche' ? d.labels.slice(0, d.pages.indexOf(r.page) + 1).map(l => (/^Fiche (\d+)/.exec(l) || [])[1]).filter(Boolean).pop() : null;
    const label = d.kind === 'manuel' ? `Revoir dans le cours (manuel p. ${p})` : d.kind === 'recap' ? `Fiche récap p. ${p}` : fno ? `Ma fiche ${fno}` : `Mes fiches p. ${p}`;
    return `<button class="btn" onclick="openCours(${modId},'${r.doc}',${r.page})">${ic(KIND_IC[d.kind])}${label}</button>`;
  }).join('')}</div>`;
}

// renvoi obligatoire au cours sous chaque explication :
//  - question du cours : citation exacte du manuel (vérifiée à la construction) + bouton vers la page
//  - question des modules : bouton vers la page du manuel (+ fiches) qui en parle
function manualTarget(page, mid) {
  if (!COURS) return null;
  const keys = m => (COURS.mods[m] || []).filter(k => COURS.docs[k].kind === 'manuel' && COURS.docs[k].pages.includes(page));
  if (keys(mid)[0]) return [mid, keys(mid)[0]];
  for (const m of Object.keys(COURS.mods)) if (keys(m)[0]) return [+m, keys(m)[0]];
  return null;
}
// titre de la partie du manuel pour une page (index PDF), d'après les intitulés relevés dans cours.js
function manualSection(page) {
  for (const k in (COURS || {}).docs || {}) { const d = COURS.docs[k]; if (d.kind !== 'manuel') continue; const i = d.pages.indexOf(page); if (i >= 0 && d.labels[i]) return d.labels[i]; }
  return '';
}
function manualBox(d, page, onclick) {
  const sec = manualSection(page);
  return `<div class="mref"><span class="mref-ic">${ic('book')}</span><span class="mref-t"><small>À revoir dans ton manuel</small>
    <b>Manuel CCA PRATIQUE · page ${esc(pshort(pnum(d, page)))}</b>${sec ? `<span>${esc(sec)}</span>` : ''}</span>
    <button class="btn primary" onclick="${onclick}">${ic('book')}Ouvrir</button></div>`;
}
function qRefs(q, mid) {
  if (!q.cref || !q.cref.length) return coursRefs(q, mid);
  const t = manualTarget(q.cref[0].page, mid);
  const d = t && COURS.docs[t[1]];
  // encadré page + partie (avec bouton), puis la ou les phrases exactes du manuel qui donnent la réponse
  const box = d ? manualBox(d, q.cref[0].page, `openCours(${t[0]},'${t[1]}',${q.cref[0].page},'Manuel CCA PRATIQUE')`)
    : `<div class="mref"><span class="mref-ic">${ic('book')}</span><span class="mref-t"><small>À revoir dans ton manuel</small><b>Manuel CCA PRATIQUE · page ${esc(pshort(String(q.cref[0].printed)))}</b></span></div>`;
  return box + q.cref.map(r => `<div class="quote"><div class="src">${ic('book')}Manuel p. ${esc(pshort(String(r.printed)))}${manualSection(r.page) ? ' · ' + esc(manualSection(r.page)) : ''}</div>${r.quote ? `<q>${esc(r.quote)}</q>` : ''}</div>`).join('');
}

// ---------- paramètres : réinitialiser la progression ----------
// (les identifiants d'étapes sont uniques sur le site de l'école : effacer un module ne touche pas aux autres)
const resetMod = m => { delete store.runs[m.id]; m.steps.forEach(s => delete store.q[s.sid]); coursQ().filter(q => q.mod === m.id).forEach(q => delete store.q[q.sid]); };
const modDone = m => m.steps.filter(s => isQ(s) && store.q[s.sid]).length;
function settings() {

  const total = DATA.modules.reduce((a, m) => a + modDone(m), 0);

    <p class="hint" style="text-align:center">Efface les réponses enregistrées, les erreurs et le meilleur score du module choisi. L'autre formation n'est pas touchée.</p>
    ${DATA.modules.map(m => { const n = modDone(m), nq = m.steps.filter(isQ).length; return `<div class="set-row">
      <span class="mod-ic">${ic(MOD_IC[m.id] || 'book')}</span>

      <button class="btn" onclick="askReset(${m.id})" ${n || store.runs[m.id] != null ? '' : 'disabled'}>${ic('trash')}Réinitialiser</button></div>`; }).join('')}
    <div class="nav"><button class="btn" onclick="home()">${ic('back')}Retour</button>
      <button class="btn danger" onclick="askReset('all')" ${total ? '' : 'disabled'}>${ic('trash')}Tout réinitialiser (${F.label})</button></div></div>`;
  scrollTo(0, 0);
}
function askReset(which) {

// ---------- session ----------
let S = null;
function startCourse(id) {
  const m = mod(id);
  S = { title:m.name, modId:id, mode:'course', items:[{type:'intro', html:m.intro, title:m.name}, ...m.steps], i:0, score:0, nq:0, res:{}, t0:Date.now() };
  render();
}
function startQuiz(which, mistakesOnly) {
  let qs, title, modId = null;
  if (which === 'all') { qs = allQ(); title = 'Quiz complet'; }

  else { const m = mod(which); modId = m.id; title = m.name + (mistakesOnly ? ' – erreurs' : ''); qs = m.steps.filter(isQ).map(s => ({...s, mod:m.id})); if (mistakesOnly) qs = qs.filter(q => isMistake(q.sid)); }
  S = { title, modId: mistakesOnly ? null : modId, mode:'quiz', items:shuffle(qs), i:0, score:0, nq:0, res:{}, t0:Date.now() };

// ---------- entraînement : paramétrage (source, modules, nombre, mode révision / examen) ----------
let TRAIN = { src:'both', n:20, exam:false, mods:null };
try { TRAIN = { ...TRAIN, ...JSON.parse(localStorage.getItem('cca-train')) || {}, mods:null }; } catch (e) {}
function trainPool() {
  const src = TRAIN.src === 'cours' ? coursQ() : TRAIN.src === 'modules' ? allQ() : everyQ();

// fromStart : ouvert depuis le premier écran → « Retour » y ramène

      <label><input type="radio" name="mode" value="exam" ${TRAIN.exam ? 'checked' : ''}><span><b>Mode examen</b><span>Aucune correction pendant le test. Score et correction détaillée à la fin.</span></span></label>

  const sync = () => {

function startTrain() {

// ----- menu latéral -----
let sideOpen = innerWidth > 900;
try { const v = localStorage.getItem('cca-side'); if (v !== null && innerWidth > 900) sideOpen = v === '1'; } catch (e) {}
function setSide(open) {

}
const STEP_IC = { intro:'flag', video:'pcircle', page:'book', pdf:'doc', mcq:'checklist', truefalse:'help', match:'dots', order:'reorder', hotspot:'shapes' };
function renderSide() {
  const atEnd = S.i >= S.items.length;
  const li = (i, icon, label, extra) => {
    // mode examen : pas de ✔/✘ avant la fin, juste « répondue »
    const hide = S.exam && !S.done, r = hide ? undefined : S.res[i], cur = i === S.i;
    const cls = ['step', cur ? 'cur' : '', r === true ? 'ok' : r === false ? 'ko' : (i < S.i || (hide && S.res[i] !== undefined)) ? 'seen' : ''].join(' ');
    const dot = r === true ? ic('check') : r === false ? ic('x') : '';
    return `<li class="${cls}" ${extra || `onclick="goTo(${i})"`} title="${esc(label)}"><span class="dot">${dot}</span><span class="sic">${ic(icon)}</span><span class="lbl">${esc(label)}</span></li>`;
  };
  side.innerHTML = `<div class="side-head"><span>${S.mode === 'quiz' ? 'Questions' : 'Étapes du module'}</span>
    <button class="side-x" onclick="setSide(false)" aria-label="Fermer le menu">${ic('x')}</button></div>
    <ol class="steps">${S.items.map((it, i) => li(i, STEP_IC[it.type] || 'help', it.type === 'intro' ? 'Introduction' : it.title)).join('')}

function goTo(i) { S.i = i; if (innerWidth <= 900) setSide(false); render(); }

function render() {
  if (S.i >= S.items.length) return finish();
  app.className = 'narrow';
  topbar();
  const it = S.items[S.i];
  S.answered = false;
  // mode examen : une question déjà répondue n'est pas rejouable ; sa correction n'apparaît qu'une fois le test terminé
  if (S.exam && S.review[S.i]) {
    const nav = `<div class="nav"><button class="btn" onclick="prev()" ${S.i ? '' : 'disabled'}>${ic('back')}Précédent</button><button class="btn primary" onclick="next()">${S.i + 1 < S.items.length ? `Suivante${ic('next')}` : 'Voir le résultat'}</button></div>`;
    app.innerHTML = `<div class="qcard">${S.done ? S.review[S.i].html : `<div class="kicker"><span class="type">${ic('flag')}Examen</span></div><h2 class="q-title">${esc(it.title)}</h2>

        ? `<div class="yt-box"><iframe src="https://www.youtube-nocookie.com/embed/${it.youtubeId}" title="${esc(it.title)}" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`
        : localPlayer(it.video, false)}
      ${coursRefs(it, it.mod || S.modId)}`;
  else if (it.type === 'page') body = `<div class="kicker"><span class="type">${ic('book')}Cours</span></div><h2 class="q-title">${esc(it.title)}</h2>
      <div class="intro">${it.html || ''}</div>
      ${it.youtube ? `<div class="yt-box"><iframe src="https://www.youtube-nocookie.com/embed/${it.youtube}" title="${esc(it.title)}" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
      <p class="file"><a href="https://www.youtube.com/watch?v=${it.youtube}" target="_blank" rel="noopener">${ic('ext')} Ouvrir la vidéo sur YouTube</a> (nécessite Internet)</p>` : ''}`;
  else if (it.type === 'pdf') body = `<div class="kicker"><span class="type">${ic('doc')}Fiche récapitulative</span></div><h2 class="q-title">${esc(it.title)}</h2>
      <div class="pdf-box"><iframe src="media/${encodeURIComponent(it.pdf)}#view=FitH" title="${esc(it.title)}"></iframe></div>
      <p class="file"><a href="media/${encodeURIComponent(it.pdf)}" target="_blank">${ic('ext')} Ouvrir le PDF en plein écran</a></p>`;
  else body = renderQ(it);
  const nextBtn = isQ(it) ? `<button class="btn primary" id="check">${S.exam ? `Valider et continuer${ic('next')}` : 'Valider'}</button>` : `<button class="btn primary" onclick="next()">Continuer${ic('next')}</button>`;
  app.innerHTML = `<div class="qcard">${body}<div id="fb"></div>
    <div class="nav"><button class="btn" onclick="prev()" ${S.i ? '' : 'disabled'}>${ic('back')}Précédent</button>${nextBtn}</div></div>`;
  if (isQ(it)) { bindQ(it); document.getElementById('check').onclick = () => S.answered ? next() : check(it); }
  freeLocal(); fillLocal(app);
  scrollTo(0, 0);
}
// ----- quitter : confirmation avant de revenir à l'accueil (tous les modes) -----

// bouton « Continuer » du haut, comme sur le site : valide la question ou passe à l'étape suivante

// ---------- questions ----------
function head(q) {

  const m = S.mode === 'quiz' && q.mod && !S.modId ? `<span>· ${esc(mod(q.mod).name)}</span>` : '';
  const wasKo = isMistake(q.sid) ? '<span class="chip ko">ratée la dernière fois</span>' : '';

  return `<div class="kicker"><span class="type">${ic(icn)}${lab}</span>${m}${src}${wasKo}</div>
    <h2 class="q-title">${esc(q.title)}</h2>${q.description ? `<div class="desc">${q.description}</div>` : ''}<div id="fbtop"></div>`;
}
const LET = 'ABCDEFGHIJ';
function renderQ(q) {
  if (q.type === 'mcq' || q.type === 'truefalse') {
    // cases à cocher ou boutons radio exactement comme sur le site (aucun indice sur le nombre de réponses)
    const multi = q.type === 'mcq' && q.input !== 'radio';
    const base = q.options.map((o, k) => ({...o, k}));

      opts.map((o, i) => `<label class="opt${multi ? ' multi' : ''}" data-k="${o.k}"><input type="${multi ? 'checkbox' : 'radio'}" name="o">${q.type === 'truefalse' ? '' : `<span class="letter">${LET[i]}</span>`}<span>${esc(o.text)}</span></label>`).join('') + '</div>';
  }

      <div class="hs-wrap"><ul class="hs-list" id="hsl"></ul><div class="hs" id="hs"><img src="media/${encodeURIComponent(q.image)}" alt=""></div></div>

}
function mv(i, d) { const q = S.items[S.i]; const o = q._order; [o[i], o[i + d]] = [o[i + d], o[i]]; drawOrder(q); }

        R = 128 - (gx / L) * m * 127; G = 128 - (gy / L) * m * 127;           // vers l'intérieur
      }
      px[i] = R; px[i + 1] = G; px[i + 2] = 128; px[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return c.toDataURL();
  }
  function apply(el) {
    const w = Math.round(el.offsetWidth), h = Math.round(el.offsetHeight);
    if (w < 8 || h < 8) return;
    const r = Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0, w / 2, h / 2);
    const id = `lg-${w}-${h}-${Math.round(r)}`;
    if (!made.has(id)) {
      made.add(id);
      svg.insertAdjacentHTML('beforeend', `<filter id="${id}" x="0" y="0" width="${w}" height="${h}" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feImage href="${mapURL(w, h, r)}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="m"/>
        <feDisplacementMap in="SourceGraphic" in2="m" scale="${SCALE}" xChannelSelector="R" yChannelSelector="G"/></filter>`);
    }
    el.style.setProperty('--lg-bf', `url(#${id}) blur(var(--lg-blur)) saturate(190%) brightness(1.08)`);
  }
  const ro = new ResizeObserver(es => es.forEach(e => apply(e.target))), seen = new WeakSet();
  const scan = () => document.querySelectorAll(SEL).forEach(el => { if (!seen.has(el)) { seen.add(el); ro.observe(el); } });
  new MutationObserver(scan).observe(document.body, { childList: true, subtree: true });
  scan();
})();
</script>
