<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4f99"/>
      <stop offset=".55" stop-color="#0f2a57"/>
      <stop offset="1" stop-color="#081427"/>
    </linearGradient>
    <radialGradient id="sun" cx=".22" cy=".2" r=".55">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#ff9a3c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="jet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfdcf2"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#sun)"/>
    <!-- horizon : courbure de la Terre -->
    <path d="M-60 300 Q256 170 572 300" fill="none" stroke="#7fc4ff" stroke-opacity=".55" stroke-width="5"/>
    <path d="M-60 300 Q256 170 572 300 L572 560 L-60 560 Z" fill="#081427" fill-opacity=".35"/>
    <!-- traînées -->
    <path d="M128 336 L96 512" stroke="url(#trail)" stroke-width="10" stroke-linecap="round"/>
    <path d="M384 336 L416 512" stroke="url(#trail)" stroke-width="10" stroke-linecap="round"/>
    <!-- avion vu de dessus -->
    <path fill="url(#jet)" d="M256 84 C267 104 273 136 275 168 L277 212 L300 234 L300 212 L314 212 L314 250 L398 322 L398 348 L283 320 L281 352 L320 382 L320 402 L263 389 L256 410 L249 389 L192 402 L192 382 L231 352 L229 320 L114 348 L114 322 L198 250 L198 212 L212 212 L212 234 L235 212 L237 168 C239 136 245 104 256 84 Z"/>
    <path d="M246 150 Q256 128 266 150 L264 186 L248 186 Z" fill="#0f2a57" fill-opacity=".75"/>
    <rect width="512" height="512" fill="none"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#rim)" stroke-width="6"/>
</svg>
